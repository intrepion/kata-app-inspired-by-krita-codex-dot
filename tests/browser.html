<!doctype html><html lang="en"><meta charset="utf-8"><title>Mosslight browser engine tests</title><style>body{background:#202722;color:#e5efda;font:16px monospace;padding:32px}li{margin:12px 0}.fail{color:#ffb2a6}</style><h1>Mosslight browser engine tests</h1><p id="result">Running…</p><ol id="tests"></ol><script type="module">
import {canvas,createLayer,composite,stamp,stroke,serialize,hydrate} from '../src/engine.js';
import {validateProject} from '../src/model.js';import {makeStudy,makeBlank} from '../src/study.js';
const tests=[];function test(name,fn){tests.push([name,fn]);}function assert(v,m='Assertion failed'){if(!v)throw Error(m);}const pixel=(c,x=50,y=50)=>c.getContext('2d').getImageData(x,y,1,1).data;
const settings={tool:'brush',preset:'round',size:30,color:'#ff0000',opacity:100,pressure:false,pointerType:'mouse',mirror:false};
test('Round brush paints the intended pixel',()=>{const c=canvas();stamp(c.getContext('2d'),{x:50,y:50,pressure:.5},settings);assert(pixel(c)[0]===255&&pixel(c)[3]===255);});
test('Eraser removes paint rather than painting white',()=>{const c=canvas();stamp(c.getContext('2d'),{x:50,y:50,pressure:.5},settings);stamp(c.getContext('2d'),{x:50,y:50,pressure:.5},{...settings,tool:'eraser'});assert(pixel(c)[3]===0);});
test('Interpolated stroke paints without endpoint gaps',()=>{const c=canvas();stroke(c.getContext('2d'),{x:20,y:50,pressure:.5},{x:200,y:50,pressure:.5},settings);assert(pixel(c,100,50)[3]===255);assert(pixel(c,200,50)[3]===255);});
test('Mirrored strokes appear across the canvas axis',()=>{const c=canvas();stroke(c.getContext('2d'),{x:30,y:50,pressure:.5},{x:50,y:50,pressure:.5},{...settings,mirror:true});assert(pixel(c,1150,50)[3]===255);});
test('Hidden layers do not enter the composite',()=>{const l=createLayer('Hidden');stamp(l.canvas.getContext('2d'),{x:50,y:50,pressure:.5},settings);l.visible=false;const c=canvas();composite(c,[l]);assert(pixel(c)[3]===0);});
test('Layer opacity changes composite alpha',()=>{const l=createLayer('Half');stamp(l.canvas.getContext('2d'),{x:50,y:50,pressure:.5},settings);l.opacity=.5;const c=canvas();composite(c,[l]);assert(pixel(c)[3]>=127&&pixel(c)[3]<=128);});
test('Layer ordering determines visible paint',()=>{const a=createLayer('Red'),b=createLayer('Green');stamp(a.canvas.getContext('2d'),{x:50,y:50,pressure:.5},settings);stamp(b.canvas.getContext('2d'),{x:50,y:50,pressure:.5},{...settings,color:'#00ff00'});const c=canvas();composite(c,[a,b]);assert(pixel(c)[1]===255);composite(c,[b,a]);assert(pixel(c)[0]===255);});
test('Soft wash, pastel, graphite and flat brushes produce pixels',()=>{for(const preset of ['wash','chalk','pencil','flat']){const c=canvas();stroke(c.getContext('2d'),{x:20,y:50,pressure:.5},{x:100,y:50,pressure:.5},{...settings,preset});assert(c.getContext('2d').getImageData(0,0,150,100).data.some((v,i)=>i%4===3&&v>0),preset);}});
test('Project roundtrip preserves layer pixels and metadata',async()=>{const state=makeBlank();state.name='Roundtrip';stamp(state.layers[1].canvas.getContext('2d'),{x:50,y:50,pressure:.5},settings);const data=validateProject(serialize(state)),next=await hydrate(data);assert(next.name==='Roundtrip');assert(next.active===state.active);assert(pixel(next.layers[1].canvas)[0]===255);assert(pixel(next.layers[1].canvas)[3]===255);});
test('PNG export has a valid PNG signature',async()=>{const c=canvas();await new Promise((resolve,reject)=>c.toBlob(async b=>{try{const bytes=new Uint8Array(await b.arrayBuffer());assert([...bytes.slice(0,8)].join(',')==='137,80,78,71,13,10,26,10');resolve();}catch(e){reject(e);}},'image/png'));});
test('Original starter study has four separately editable layers',()=>{const s=makeStudy();assert(s.layers.length===4);assert(s.active===s.layers[3].id);assert(pixel(s.layers[0].canvas)[3]===255);assert(pixel(s.layers[3].canvas)[3]===0);});
test('Invalid raster dimensions are rejected before replacing artwork',async()=>{const c=document.createElement('canvas');c.width=1;c.height=1;const data=serialize(makeBlank());data.layers[0].image=c.toDataURL();let rejected=false;try{await hydrate(data);}catch{rejected=true;}assert(rejected);});
let passed=0;for(const [name,fn] of tests){const li=document.createElement('li');try{await fn();li.textContent='PASS · '+name;passed++;}catch(e){li.textContent='FAIL · '+name+' · '+e.message;li.className='fail';}document.querySelector('#tests').append(li);}document.querySelector('#result').textContent=`${passed}/${tests.length} passed`;document.title=`${passed}/${tests.length} · Mosslight browser tests`;
</script></html>
